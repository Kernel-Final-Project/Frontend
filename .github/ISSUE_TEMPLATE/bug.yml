name: "🐞 Bug Report"
description: "버그 또는 오류 제보"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📄 문제 설명
      description: 발생한 문제를 명확히 설명해 주세요
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 재현 절차
      description: 에러가 발생하는 과정을 단계별로 작성해주세요
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 기대 동작
      description: 정상적으로 작동했을 때 예상되는 결과를 설명해주세요

  - type: textarea
    id: evidence
    attributes:
      label: 📸 로그 / 스크린샷
      description: |
        관련된 error log, request/response 등을 첨부해 주세요
