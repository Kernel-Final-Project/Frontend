name: "♻️ Refactor"
description: "리팩토링 작업 요청"
labels: ["refactor"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: 리팩토링의 이유와 목적을 설명해 주세요
      placeholder: |
        예시: XXX 서비스의 코드 복잡도 개선
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업할 내용
      description: 리팩토링 할 항목들을 체크리스트로 작성해주세요
      placeholder: |
        - [ ] 불필요한 코드 제거
        - [ ] 모듈 구조 개선
        - [ ] 테스트 커버리지 강화
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: ⚠️ 영향 범위
      description: 이 리팩토링으로 영향받을 수 있는 기능이 있나요?
      placeholder: |
        예시: 사용자 회원가입 API에 영향 가능성
